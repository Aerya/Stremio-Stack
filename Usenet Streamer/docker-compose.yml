# version en développement qui se configure via la WebUI. Pour l'instant ne fonctionne pas avec NZBhydra.
  stremio-usenetstreamer:
    container_name: stremio-usenetstreamer
    restart: always
    ports:
      - 32867:7000
    environment:
      ADDON_SHARED_SECRET: blahbluhbloh # Juste un truc à mettre entre https://stremio-usenetstreamer.xxx.xxx/..../manifest.json
    image: ghcr.io/sanket9225/usenetstreamer:dev
    labels:
      - com.centurylinklabs.watchtower.enable=true

  nzbhydra2:
    image: lscr.io/linuxserver/nzbhydra2:dev
    container_name: nzbhydra2
    restart: always
    # Passe par un VPN pour aller interroger les indexeurs
    network_mode: container:gluetun-airvpn
    environment:
      TZ: Europe/Paris
      PUID: 0
      PGID: 0
    volumes:
      - /home/aerya/docker/nzbhydra2/data:/config
    labels:
      - com.centurylinklabs.watchtower.enable=true
networks: {}
