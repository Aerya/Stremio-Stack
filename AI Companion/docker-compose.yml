services:
  stremio-ai-companion:
    image: ghcr.io/willtho89/stremio-ai-companion:latest
    container_name: stremio-ai-companion
    restart: always
    ports:
      - 32861:8000
    environment:
      ENCRYPTION_KEY: cfdef005a7a56a024ee9c3ade4db126aa1341cddb40b5e9ab0d237c6db5321ea # générer avec openssl rand -hex 32
      ENABLE_FEED_CATALOGS: true
      SPLIT_MANIFESTS: false
      MAX_CATALOG_RESULTS: 10
      MAX_CATALOG_ENTRIES: 100
      CACHE_SEARCH_QUERY_TTL: 14400
      OPENAI_API_KEY: sk-xxx
      OPENAI_BASE_URL: https://api.openai.com/v1
      # TMDB Token et non clé API
      TMDB_API_KEY: xxx
      RPDB_API_KEY: xxx
    labels:
      - com.centurylinklabs.watchtower.enable=true