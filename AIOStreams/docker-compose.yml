      ADDON_NAME: AIOStreams
      ADDON_ID: stremio-aiostreams.xxx.xxx
      BASE_URL: https://stremio-aiostreams.xxx.xxx
      SECRET_KEY: 3235e71b025744651475d58e51ef86f929a1edbc7fad8fa7cbda48ca89e9d823 # générer avec openssl rand -hex 32
      ADDON_PASSWORD: null
      DATABASE_URI: sqlite://./data/db.sqlite
      REDIS_URI: redis://stremio-aiostreams-redis:6379
      BUILTIN_STREMTHRU_URL: https://stremthru.13377001.xyz
      BUILTIN_SCRAPE_WITH_ALL_TITLES: false
      BUILTIN_DEBRID_INSTANT_AVAILABILITY_CACHE_TTL: 1800
      BUILTIN_DEBRID_PLAYBACK_LINK_CACHE_TTL: 3600
      BUILTIN_GET_TORRENT_TIMEOUT: 5000
      BUILTIN_GET_TORRENT_CONCURRENCY: 30
